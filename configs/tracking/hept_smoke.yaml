# Tiny CPU smoke test for the HEPT baseline on the SAME synthetic tracking data.
# Confirms the copied HEPT backbone is intact so HEPT vs DeltaNet is apples-to-apples.
device: cuda:0
seed: 42
num_threads: 4
note: smoke

model_name: trans_hept
model_kwargs:
  block_size: 16
  n_hashes: 2
  num_regions: 10
  pe_type: none
  num_heads: 4
  h_dim: 16
  n_layers: 2
  num_w_per_dist: 10

loss_name: infonce
loss_kwargs:
  dist_metric: l2_rbf
  tau: 0.05

optimizer_name: adam
num_epochs: 2
batch_size: 1
optimizer_kwargs:
  lr: 1.0e-3

lr_scheduler_name: step
lr_scheduler_kwargs:
  gamma: 0.5
  step_size: 500

data_dir: data/tracking_smoke
dataset_name: tracking-6k
main_metric: accuracy@0.9
mode: max
max_events: null
