# DeltaNet delta-rule mixer with the HEPT Gaussian kernel approximated by RFF.
device: cuda:0
seed: 42
num_threads: 4
note: hept-kernel-smoke
model_name: trans_deltanet
model_kwargs:
  num_heads: 4
  h_dim: 16
  n_layers: 2
  chunk_size: 16
  deltanet_sort_key: eta
  deltanet_direction: bi
  deltanet_qk_norm: none
  deltanet_qk_activation: identity
  deltanet_use_beta: true
  deltanet_allow_neg_eigval: false
  deltanet_impl: torch
  deltanet_kernel: hept
  deltanet_hept_backend: rff
  deltanet_kernel_features: 128
  deltanet_kernel_seed: 0
  num_w_per_dist: 10
loss_name: infonce
loss_kwargs:
  dist_metric: l2_rbf
  tau: 0.05
optimizer_name: adam
num_epochs: 2
batch_size: 1
optimizer_kwargs:
  lr: 0.001
lr_scheduler_name: step
lr_scheduler_kwargs:
  gamma: 0.5
  step_size: 500
data_dir: data/tracking_smoke
dataset_name: tracking-6k
main_metric: accuracy@0.9
mode: max
max_events: null
