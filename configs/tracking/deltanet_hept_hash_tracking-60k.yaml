# Hash-selected exact Gaussian DeltaNet with independent bucket memories.
device: cuda:0
seed: 42
num_threads: 5
note: hept-hash-delta-run
optimizer_name: adam
batch_size: 1
max_events: null
model_name: trans_deltanet
model_kwargs:
  num_heads: 8
  h_dim: 24
  n_layers: 4
  chunk_size: 64
  deltanet_sort_key: eta
  deltanet_direction: bi
  deltanet_qk_norm: none
  deltanet_qk_activation: identity
  deltanet_use_beta: true
  deltanet_allow_neg_eigval: false
  deltanet_impl: torch
  deltanet_kernel: hept
  deltanet_hept_backend: hash
  block_size: 100
  n_hashes: 3
  num_regions: 150
  deltanet_hash_chunk_buckets: 64
  deltanet_hash_checkpoint: true
  num_w_per_dist: 10
loss_name: infonce
loss_kwargs:
  dist_metric: l2_rbf
  tau: 0.05
num_epochs: 2000
optimizer_kwargs:
  lr: 0.01
lr_scheduler_name: step
lr_scheduler_kwargs:
  gamma: 0.5
  step_size: 500
data_dir: data
dataset_name: tracking-60k
main_metric: accuracy@0.9
mode: max
