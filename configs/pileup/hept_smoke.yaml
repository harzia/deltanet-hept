# Offline CPU HEPT smoke test on synthetic pileup.
device: cuda:0
seed: 42
num_threads: 4
note: smoke
model_name: trans_hept
model_kwargs:
  block_size: 16
  n_hashes: 2
  num_regions: 10
  pe_type: none
  num_heads: 4
  h_dim: 16
  n_layers: 2
  num_w_per_dist: 10
loss_name: crossentropy
loss_kwargs: {}
optimizer_name: adam
num_epochs: 1
batch_size: 1
optimizer_kwargs:
  lr: 0.001
lr_scheduler_name: step
lr_scheduler_kwargs:
  gamma: 0.5
  step_size: 500
data_dir: data/pileup_smoke
dataset_name: pileup
main_metric: auc
mode: max
max_events: 4
