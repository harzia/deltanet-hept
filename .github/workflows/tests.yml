name: CPU correctness and smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --only-binary=:all: torch_scatter torch_cluster -f https://data.pyg.org/whl/torch-2.5.0+cpu.html
      - run: python -m pip install -r requirements.txt
      - run: PYTHON=python bash scripts/smoke_test.sh
